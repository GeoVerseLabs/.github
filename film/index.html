<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('film');
  var Q = new URLSearchParams(location.search);
  var CAPTURE = Q.get('capture') === '1';
  var EMBED = Q.get('embed') === '1';
  if (CAPTURE) document.body.classList.add('capture');
  if (EMBED) document.body.classList.add('embed');
  var LANG = window.__lang;
  var TOTAL = 52;

  /* ---------------- helpers ---------------- */
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);

  }
  function set(e, attrs) { for (var k in attrs) e.setAttribute(k, attrs[k]); }
  function clamp(v, a, b) { return Math.max(a === undefined ? 0 : a, Math.min(b === undefined ? 1 : b, v)); }

  function ease(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rng(seed) { var s = seed; return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
  var I18N = [];
  function txt(parent, attrs, zh, en) {
    var t = el('text', attrs, parent);
    I18N.push({ el: t, zh: zh, en: en });
    t.textContent = LANG === 'en' ? en : zh;
    return t;
  }
  function relabel() {
    I18N.forEach(function (r) { r.el.textContent = LANG === 'en' ? r.en : r.zh; });
    fitPills();
  }
  var PILLS = [];
  function pill(parent, x, y, color, zh, en, opts) {
    opts = opts || {};
    var g = el('g', { transform: 'translate(' + x + ' ' + y + ')' }, parent);
    var h = opts.h || 52, fs = opts.fs || 24;
    var r = el('rect', { x: 0, y: -h / 2, height: h, rx: h / 2, fill: opts.fill || 'rgba(16,19,26,.92)', stroke: opts.stroke || '#2f3548', 'stroke-width': 1.5 }, g);
    var dot = el('circle', { cx: h / 2, cy: 0, r: fs * .3, fill: color }, g);
    var t = txt(g, { x: h / 2 + fs * .75, y: fs * .36, 'font-size': fs, 'font-weight': opts.weight || 600, fill: opts.textFill || '#e8eaf0', class: opts.mono ? 'mono' : '' }, zh, en === undefined ? zh : en);
    var p = { g: g, rect: r, text: t, h: h, fs: fs, align: opts.align || 'left', x: x, y: y, dot: dot };
    PILLS.push(p);
    return p;
  }
  function fitPills() {
    PILLS.forEach(function (p) {
      var w = p.text.getComputedTextLength() + p.h / 2 + p.fs * .75 + p.h * .45;
      p.rect.setAttribute('width', w);
      p.w = w;
      if (p.align === 'right') p.g.setAttribute('transform', 'translate(' + (p.x - w) + ' ' + p.y + ')');
      if (p.align === 'center') p.g.setAttribute('transform', 'translate(' + (p.x - w / 2) + ' ' + p.y + ')');
    });
  }
  function caption(g, zh, en, subZh, subEn) {
    var c = el('g', {}, g);
    var main = txt(c, { x: 960, y: 940, 'text-anchor': 'middle', 'font-size': 54, 'font-weight': 700, fill: '#f2f4f8' }, zh, en);
    var sub = subZh ? txt(c, { x: 960, y: 1000, 'text-anchor': 'middle', 'font-size': 29, fill: '#a4abbd' }, subZh, subEn) : null;
    return {
      g: c,
      show: function (lt, a, b) {
        var i = easeOut(seg(lt, a, a + .6)), o = b === undefined ? 1 : 1 - seg(lt, b, b + .4);
        c.setAttribute('opacity', Math.min(i, o));
        c.setAttribute('transform', 'translate(0 ' + (1 - i) * 18 + ')');
      }
    };
  }

  /* ---------------- defs + backdrop ---------------- */
  var defs = el('defs');
  defs.innerHTML =
    '<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset=".5" stop-color="#8b6cf6"/><stop offset="1" stop-color="#2fbf8a"/></linearGradient>' +
    '<linearGradient id="brandH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f8cff"/><stop offset=".5" stop-color="#b39dff"/><stop offset="1" stop-color="#2fbf8a"/></linearGradient>' +
    '<radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset="0" stop-color="#101626"/><stop offset=".6" stop-color="#070a10"/><stop offset="1" stop-color="#030406"/></radialGradient>' +
    '<pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.2" fill="#1a2030"/></pattern>' +
    '<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    '<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>' +
    '<clipPath id="frameClip"><rect x="240" y="170" width="1440" height="630" rx="22"/></clipPath>' +
    '<clipPath id="clipL"><rect id="clipLr" x="240" y="170" width="720" height="630"/></clipPath>' +
    '<clipPath id="clipR"><rect id="clipRr" x="960" y="170" width="720" height="630"/></clipPath>';
  el('rect', { width: 1920, height: 1080, fill: 'url(#vig)' });
  el('rect', { width: 1920, height: 1080, fill: 'url(#dots)', opacity: .7 });
  var glowBlob = el('circle', { cx: 960, cy: 470, r: 420, fill: '#8b6cf6', opacity: .08, filter: 'url(#soft)' });

  var SCENES = [];
  function scene(start, end, titleZh, titleEn) {
    var g = el('g', { display: 'none' });
    var s = { start: start, end: end, g: g, update: function () {}, zh: titleZh, en: titleEn };
    SCENES.push(s);
    return s;
  }

  /* =========================================================
     S1 · ORIGIN  (0 – 6)
     ========================================================= */
  var s1 = scene(0, 6, '坐标', 'Origin');
  (function () {
    var root = el('g', {}, s1.g);
    var globe = el('g', {}, root);
    var R = 230;
    var outer = el('circle', { r: R, fill: 'none', stroke: 'url(#brand)', 'stroke-width': 6, pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1 }, globe);
    var mer = [];
    for (var k = 0; k < 6; k++) mer.push(el('ellipse', { rx: R, ry: R, fill: 'none', stroke: '#8b6cf6', 'stroke-width': 2, opacity: 0 }, globe));
    var par = [];
    [-60, -30, 0, 30, 60].forEach(function (lat) {
      var rx = R * Math.cos(lat * Math.PI / 180);
      par.push(el('ellipse', { cx: 0, cy: -R * Math.sin(lat * Math.PI / 180), rx: rx, ry: rx * .16, fill: 'none', stroke: '#4f8cff', 'stroke-width': 2, opacity: 0 }, globe));
    });
    var D = { x: 92, y: -118 };
    var rings = [0, 1].map(function () { return el('circle', { cx: D.x, cy: D.y, r: 10, fill: 'none', stroke: '#fcd34d', 'stroke-width': 3, opacity: 0 }, globe); });
    var dot = el('circle', { cx: D.x, cy: D.y, r: 11, fill: '#fcd34d', opacity: 0, filter: 'url(#glow)' }, globe);
    var coord = el('text', { x: 960, y: 790, 'text-anchor': 'middle', 'font-size': 34, fill: '#fcd34d', class: 'mono', 'letter-spacing': 2 }, root);
    var COORD = '39.9087° N   116.3974° E';
    var cap = caption(s1.g, '每一张地图，都从一个坐标开始。', 'Every map starts with a coordinate.');
    s1.update = function (lt) {
      set(outer, { 'stroke-dashoffset': 1 - ease(seg(lt, .2, 1.6)) });
      var ph = lt * .55;
      mer.forEach(function (m, i) {
        set(m, { rx: Math.abs(R * Math.cos(ph + i * Math.PI / 6)), opacity: .5 * seg(lt, .6, 1.6) });
      });
      par.forEach(function (p) { p.setAttribute('opacity', .35 * seg(lt, .8, 1.8)); });
      var a = seg(lt, 1.4, 1.8);
      dot.setAttribute('opacity', a);
      rings.forEach(function (r, i) {
        var f = ((lt * 1.1) + i * .5) % 1;
        set(r, { r: 12 + f * 46, opacity: a * (1 - f) });
      });
      var n = Math.floor(seg(lt, 1.8, 3.0) * COORD.length);
      coord.textContent = COORD.slice(0, n) + (n < COORD.length && lt > 1.8 && Math.floor(lt * 4) % 2 ? '▍' : '');
      coord.setAttribute('opacity', 1 - seg(lt, 4.9, 5.4));
      cap.show(lt, 1.0, 4.9);
      var z = 1 + 5 * ease(seg(lt, 4.9, 6.2));
      globe.setAttribute('transform', 'translate(960 450) translate(' + D.x + ' ' + D.y + ') scale(' + z + ') translate(' + (-D.x) + ' ' + (-D.y) + ')');
    };
  })();

  /* =========================================================
     S2 · THREE COORDINATE SYSTEMS  (6 – 13)
     ========================================================= */
  var s2 = scene(6, 13, '坐标系', 'CRS');
  (function () {
    var tag = pill(s2.g, 120, 110, '#8b6cf6', 'GeoVerse SDK · 国内坐标系', 'GeoVerse SDK · China CRS');
    var streets = el('g', { opacity: 0 }, s2.g);
    var st = el('g', { transform: 'rotate(-8 960 520)' }, streets);
    for (var x = 120; x <= 1800; x += 120) el('line', { x1: x, y1: 140, x2: x, y2: 900, stroke: x % 480 === 0 ? '#25314a' : '#161d2b', 'stroke-width': x % 480 === 0 ? 9 : 4 }, st);
    for (var y = 160; y <= 900; y += 110) el('line', { x1: 80, y1: y, x2: 1840, y2: y, stroke: y === 600 ? '#25314a' : '#161d2b', 'stroke-width': y === 600 ? 9 : 4 }, st);
    var C = { x: 820, y: 570 }, G = { x: 820 + 192, y: 570 - 56 }, B = { x: 820 + 390, y: 570 - 296 };
    function marker(color, label, sub, left) {
      var g = el('g', { opacity: 0 }, s2.g);
      var dx = left ? -36 : 36, anchor = left ? 'end' : 'start';
      el('circle', { r: 30, fill: color, opacity: .18 }, g);
      el('circle', { r: 13, fill: color, stroke: '#05070b', 'stroke-width': 3 }, g);
      var l = txt(g, { x: dx, y: -8, 'font-size': 30, 'font-weight': 700, fill: color, class: 'mono', 'text-anchor': anchor }, label[0], label[1]);
      var s = txt(g, { x: dx, y: 28, 'font-size': 23, fill: '#a4abbd', 'text-anchor': anchor }, sub[0], sub[1]);
      return { g: g, l: l, s: s };
    }
    var aW = el('line', { stroke: '#6f778b', 'stroke-width': 3, 'stroke-dasharray': '8 8' }, s2.g);
    var aB = el('line', { stroke: '#6f778b', 'stroke-width': 3, 'stroke-dasharray': '8 8' }, s2.g);
    var mB = marker('#fb7185', ['BD-09', 'BD-09'], ['百度 · +1378 m', 'Baidu · +1,378 m']);
    var mG = marker('#fbbf24', ['GCJ-02', 'GCJ-02'], ['高德 / 腾讯 · +555 m', 'Amap / Tencent · +555 m']);
    var mW = marker('#ffffff', ['WGS-84', 'WGS-84'], ['真实位置 · GPS', 'True position · GPS'], true);
    var check = el('circle', { cx: C.x, cy: C.y, r: 40, fill: 'none', stroke: '#2fbf8a', 'stroke-width': 4, opacity: 0 }, s2.g);
    var cap1 = caption(s2.g, '在中国，同一个点有三套坐标。', 'In China, one place has three sets of coordinates.',
      'WGS-84 · GCJ-02 · BD-09——相差数百米，甚至上千米', 'WGS-84 · GCJ-02 · BD-09 — hundreds of metres, even a kilometre apart');
    var cap2 = caption(s2.g, 'GeoVerse 对外恒为 WGS-84，纠偏在引擎里完成。', 'GeoVerse speaks WGS-84. Correction happens inside the engine.',
      'OpenLayers 在投影层纠偏，MapLibre 在数据出入边界纠偏', 'At the projection layer in OpenLayers, at the data boundary in MapLibre');
    s2.update = function (lt) {
      tag.g.setAttribute('opacity', seg(lt, .1, .6));
      streets.setAttribute('opacity', seg(lt, 0, .7));
      var w = easeOut(seg(lt, .3, .8));
      set(mW.g, { opacity: w, transform: 'translate(' + C.x + ' ' + C.y + ') scale(' + (.6 + .4 * w) + ')' });
      var back = ease(seg(lt, 4.4, 5.4));
      var g1 = ease(seg(lt, 1.2, 2.2)) * (1 - back), b1 = ease(seg(lt, 2.4, 3.4)) * (1 - back);
      var gx = lerp(C.x, G.x, g1), gy = lerp(C.y, G.y, g1);
      var bx = lerp(gx, B.x, b1), by = lerp(gy, B.y, b1);
      set(mG.g, { opacity: seg(lt, 1.2, 1.5) * (1 - seg(lt, 5.1, 5.4)), transform: 'translate(' + gx + ' ' + gy + ')' });
      set(mB.g, { opacity: seg(lt, 2.4, 2.7) * (1 - seg(lt, 5.1, 5.4)), transform: 'translate(' + bx + ' ' + by + ')' });
      mG.s.setAttribute('opacity', seg(lt, 2.0, 2.4)); mB.s.setAttribute('opacity', seg(lt, 3.2, 3.6));
      set(aW, { x1: C.x, y1: C.y, x2: gx, y2: gy, opacity: seg(lt, 1.4, 1.8) * (1 - back) });
      set(aB, { x1: gx, y1: gy, x2: bx, y2: by, opacity: seg(lt, 2.6, 3.0) * (1 - back) });
      var ck = seg(lt, 5.3, 5.9);
      set(check, { opacity: ck * (1 - seg(lt, 6.6, 7)), r: 30 + ck * 26 });
      streets.setAttribute('transform', 'translate(' + (1 - back) * -16 + ' ' + (1 - back) * 6 + ')');
      cap1.show(lt, .7, 4.2);
      cap2.show(lt, 4.6);
    };
  })();

  /* =========================================================
     S3 · DUAL ENGINE (SDK)  (13 – 20)
     ========================================================= */
  var s3 = scene(13, 20, '双引擎', 'Engines');
  (function () {
    var tag = pill(s3.g, 120, 110, '#8b6cf6', 'GeoVerse SDK', 'GeoVerse SDK');
    var frame = el('g', { 'clip-path': 'url(#frameClip)' }, s3.g);
    var r = rng(13);
    function riverY(x) { return 520 + 80 * Math.sin((x - 240) / 230) - (x - 240) * .04; }
    var riverD = 'M 200 ' + riverY(200);
    for (var x = 220; x <= 1720; x += 20) riverD += ' L ' + x + ' ' + riverY(x).toFixed(1);
    var blocks = [];
    for (var bx = 250; bx < 1680; bx += 70) for (var by = 180; by < 800; by += 70) {
      if (Math.abs(by + 20 - riverY(bx + 20)) < 75 || r() < .42) continue;
      var w = 22 + r() * 30, h = 22 + r() * 30;
      blocks.push([bx + 8 + r() * 10, by + 8 + r() * 10, w, h]);
    }
    var parks = ['M 300 210 L 520 200 L 540 330 L 330 360 Z', 'M 1300 640 L 1520 610 L 1560 760 L 1330 790 Z', 'M 820 210 L 980 220 L 960 300 L 800 290 Z'];
    var majors = ['M 240 330 L 1680 300', 'M 240 700 L 1680 730', 'M 560 170 L 600 800', 'M 1180 170 L 1150 800', 'M 240 800 L 900 170'];
    function city(st, clip) {
      var g = el('g', { 'clip-path': 'url(#' + clip + ')' }, frame);
      el('rect', { x: 240, y: 170, width: 1440, height: 630, fill: st.bg }, g);
      var grid = el('g', { stroke: st.minor, 'stroke-width': st.minorW }, g);
      for (var x2 = 240; x2 <= 1680; x2 += 70) el('line', { x1: x2, y1: 170, x2: x2 + 20, y2: 800 }, grid);
      for (var y2 = 170; y2 <= 800; y2 += 70) el('line', { x1: 240, y1: y2, x2: 1680, y2: y2 - 14 }, grid);
      parks.forEach(function (d) { el('path', { d: d, fill: st.park }, g); });
      el('path', { d: riverD, fill: 'none', stroke: st.water, 'stroke-width': 64, 'stroke-linecap': 'round' }, g);
      var bg = el('g', { fill: st.bldg }, g);
      blocks.forEach(function (b) { el('rect', { x: b[0], y: b[1], width: b[2], height: b[3], rx: st.round }, bg); });
      var mg = el('g', { fill: 'none', stroke: st.major, 'stroke-width': st.majorW, 'stroke-linecap': 'round', filter: st.glow ? 'url(#glow)' : null }, g);
      if (!st.glow) mg.removeAttribute('filter');
      majors.forEach(function (d) { el('path', { d: d }, mg); });
      if (st.tiles) {
        var tg = el('g', { stroke: 'rgba(79,140,255,.14)', 'stroke-width': 1.5 }, g);
        for (var x3 = 240; x3 <= 1680; x3 += 256) el('line', { x1: x3, y1: 170, x2: x3, y2: 800 }, tg);
        for (var y3 = 170; y3 <= 800; y3 += 256) el('line', { x1: 240, y1: y3, x2: 1680, y2: y3 }, tg);
      }
      return g;
    }
    city({ bg: '#0d1424', minor: '#1b2741', minorW: 3, park: '#13283d', water: '#1c3f70', bldg: '#18233c', round: 0, major: '#4f8cff', majorW: 9, tiles: true }, 'clipL');
    city({ bg: '#0a1613', minor: '#163029', minorW: 3.5, park: '#113a2d', water: '#13493d', bldg: '#14302a', round: 5, major: '#2fbf8a', majorW: 10, glow: true }, 'clipR');
    el('rect', { x: 240, y: 170, width: 1440, height: 630, rx: 22, fill: 'none', stroke: '#2f3548', 'stroke-width': 2 }, s3.g);
    var divider = el('g', {}, s3.g);
